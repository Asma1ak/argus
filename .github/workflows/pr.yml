# ================================
# Pull Request Automation
# ================================
# Auto-labels PRs, checks for breaking changes,
# and adds helpful comments

name: PR Automation

on:
  pull_request:
    types: [opened, edited, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ================================
  # Auto Label PR
  # ================================
  label:
    name: Auto Label
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Label based on files changed
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  # ================================
  # PR Size Check
  # ================================
  size-check:
    name: PR Size
    runs-on: ubuntu-latest
    
    steps:
      - name: Check PR size
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: 10
          s_label: 'size/S'
          s_max_size: 100
          m_label: 'size/M'
          m_max_size: 500
          l_label: 'size/L'
          l_max_size: 1000
          xl_label: 'size/XL'
          fail_if_xl: false
          message_if_xl: |
            ⚠️ This PR is quite large. Consider breaking it into smaller PRs for easier review.

  # ================================
  # Conventional Commits Check
  # ================================
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        run: |
          echo "${{ github.event.pull_request.title }}" | commitlint --config .commitlintrc.json || true

  # ================================
  # First-time Contributor Welcome
  # ================================
  welcome:
    name: Welcome
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    
    steps:
      - name: Check if first contribution
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 2
            });
            const isFirst = prs.filter(pr => pr.user.login === context.payload.pull_request.user.login).length === 1;
            return isFirst;

      - name: Welcome first-time contributor
        if: steps.check.outputs.result == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `👋 Welcome @${context.payload.pull_request.user.login}! Thanks for your first contribution to Argus!
              
              A maintainer will review your PR soon. In the meantime:
              - Make sure all CI checks pass ✅
              - Add tests if applicable 🧪
              - Update documentation if needed 📝
              
              Let us know if you have any questions!`
            });
