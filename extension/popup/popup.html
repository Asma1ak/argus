<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <span class="logo">👁️ Argus</span>
      <select id="language-select" class="language-select">
        <option value="auto">🌐 Auto</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="ru">Русский</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ar">العربية</option>
        <option value="hi">हिन्दी</option>
        <option value="tr">Türkçe</option>
        <option value="pl">Polski</option>
        <option value="vi">Tiếng Việt</option>
        <option value="th">ไทย</option>
        <option value="id">Indonesia</option>
      </select>
    </header>
    
    <main class="main">
      <textarea 
        id="text-input" 
        placeholder="Paste text to analyze for fallacies, biases, and manipulation..."
        rows="6"
      ></textarea>
      
      <button id="analyze-btn" class="analyze-btn">
        <span class="btn-text">🔍 Analyze</span>
        <span class="btn-loading" style="display: none;">
          <span class="spinner"></span> Analyzing...
        </span>
      </button>
      
      <div id="error" class="error" style="display: none;"></div>
      <div id="result" class="result" style="display: none;"></div>
    </main>
    
    <footer class="footer">
      <p>💡 Tip: Select text on any page, right-click → "Analyze with Argus"</p>
    </footer>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
