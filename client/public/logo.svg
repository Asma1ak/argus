<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    
    <!-- Inner glow gradient -->
    <radialGradient id="irisGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="40%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </radialGradient>
    
    <!-- Outer glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle (optional, for icon use) -->
  <circle cx="256" cy="256" r="240" fill="#0f172a" opacity="0"/>
  
  <!-- Outer eye shape -->
  <path 
    d="M256 96 C160 96 80 176 48 256 C80 336 160 416 256 416 C352 416 432 336 464 256 C432 176 352 96 256 96 Z" 
    fill="url(#mainGradient)"
    filter="url(#shadow)"
  />
  
  <!-- Inner eye white -->
  <ellipse 
    cx="256" 
    cy="256" 
    rx="120" 
    ry="120" 
    fill="#f8fafc"
  />
  
  <!-- Iris -->
  <circle 
    cx="256" 
    cy="256" 
    r="85" 
    fill="url(#irisGradient)"
  />
  
  <!-- Pupil -->
  <circle 
    cx="256" 
    cy="256" 
    r="40" 
    fill="#1e1b4b"
  />
  
  <!-- Eye highlight (top) -->
  <ellipse 
    cx="230" 
    cy="220" 
    rx="20" 
    ry="15" 
    fill="white" 
    opacity="0.9"
  />
  
  <!-- Eye highlight (small) -->
  <circle 
    cx="280" 
    cy="245" 
    rx="8" 
    ry="8" 
    fill="white" 
    opacity="0.6"
  />
  
  <!-- Scan lines (tech effect) -->
  <g opacity="0.15">
    <line x1="100" y1="200" x2="412" y2="200" stroke="white" stroke-width="1"/>
    <line x1="80" y1="240" x2="432" y2="240" stroke="white" stroke-width="1"/>
    <line x1="80" y1="280" x2="432" y2="280" stroke="white" stroke-width="1"/>
    <line x1="100" y1="320" x2="412" y2="320" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Decorative arcs (analysis rings) -->
  <g fill="none" stroke="url(#mainGradient)" stroke-width="3" opacity="0.6">
    <path d="M256 56 C140 56 44 152 44 256" stroke-linecap="round"/>
    <path d="M256 456 C372 456 468 360 468 256" stroke-linecap="round"/>
  </g>
  
  <!-- Corner brackets (analysis frame) -->
  <g stroke="url(#mainGradient)" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Top left -->
    <path d="M72 120 L72 72 L120 72"/>
    <!-- Top right -->
    <path d="M392 72 L440 72 L440 120"/>
    <!-- Bottom left -->
    <path d="M72 392 L72 440 L120 440"/>
    <!-- Bottom right -->
    <path d="M392 440 L440 440 L440 392"/>
  </g>
</svg>
