<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="60%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </radialGradient>
  </defs>
  
  <!-- Eye icon -->
  <g transform="translate(10, 10)">
    <!-- Eye shape -->
    <path 
      d="M40 16 C26 16 14 30 8 40 C14 50 26 64 40 64 C54 64 66 50 72 40 C66 30 54 16 40 16 Z" 
      fill="url(#grad)"
    />
    
    <!-- Eye white -->
    <ellipse cx="40" cy="40" rx="20" ry="20" fill="#f8fafc"/>
    
    <!-- Iris -->
    <circle cx="40" cy="40" r="14" fill="url(#iris)"/>
    
    <!-- Pupil -->
    <circle cx="40" cy="40" r="6" fill="#1e1b4b"/>
    
    <!-- Highlight -->
    <ellipse cx="36" cy="36" rx="3" ry="2.5" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Text "ARGUS" (white for dark backgrounds) -->
  <text 
    x="105" 
    y="62" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="42" 
    font-weight="700" 
    fill="#f8fafc"
    letter-spacing="2"
  >ARGUS</text>
  
  <!-- Tagline -->
  <text 
    x="106" 
    y="82" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
    font-size="12" 
    fill="#94a3b8"
    letter-spacing="1"
  >CRITICAL THINKING ASSISTANT</text>
</svg>
