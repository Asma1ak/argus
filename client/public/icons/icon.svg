<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="60%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  
  <!-- Eye shape -->
  <path 
    d="M256 120 C176 120 108 188 76 256 C108 324 176 392 256 392 C336 392 404 324 436 256 C404 188 336 120 256 120 Z" 
    fill="url(#grad)"
  />
  
  <!-- Eye white -->
  <ellipse cx="256" cy="256" rx="100" ry="100" fill="#f8fafc"/>
  
  <!-- Iris -->
  <circle cx="256" cy="256" r="70" fill="url(#iris)"/>
  
  <!-- Pupil -->
  <circle cx="256" cy="256" r="32" fill="#1e1b4b"/>
  
  <!-- Highlight -->
  <ellipse cx="235" cy="230" rx="16" ry="12" fill="white" opacity="0.9"/>
  <circle cx="275" cy="250" r="6" fill="white" opacity="0.5"/>
</svg>
